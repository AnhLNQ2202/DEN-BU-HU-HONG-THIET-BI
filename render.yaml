# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: asset-compensation-hub
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    numInstances: 1
    envVars:
      - key: ASSET_HUB_DATA_DIR
        value: /var/data
      - key: ASSET_HUB_DEMO_MODE
        value: "true"
      - key: ASSET_HUB_SECRET_KEY
        generateValue: true
      - key: ASSET_HUB_ACCESS_USER
        value: judge
      - key: ASSET_HUB_ACCESS_PASSWORD
        generateValue: true
      - key: GUNICORN_THREADS
        value: "4"
      - key: GUNICORN_TIMEOUT
        value: "120"
    disk:
      name: asset-hub-data
      mountPath: /var/data
      sizeGB: 1
